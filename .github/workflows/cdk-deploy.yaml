name: svc-house

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - ".github/**"

jobs:
  deploy-dev:
    if: ${{ github.event.pull_request.base.ref == 'dev' }}
    runs-on: ubuntu-latest
    env: 
      APP_NAME: ${{ vars.APP_NAME }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_ACCOUNT_REGION }}
      ENV: dev

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔒 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_ACCOUNT_REGION }}

      - name: ⬇️ Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 UnInstall AWS CDK
        run: npm uninstall -g aws-cdk && rm -rf node_modules package-lock.json
  
      - name: 📦 Install aws-cdk and all dependencies
        run: |
          npm install -g aws-cdk
          npm install  
          cd app && npm install && cd .. && npm install

      - name: 📂 Print Working Directory
        run: pwd && ls  -la

      - name: 🛠️ Build Project
        run: npm run build

      - name: ⚕️ CDK Doctor
        run: cdk doctor

      - name: 🥾 CDK Bootstrap
        timeout-minutes: 15
        run: npx cdk bootstrap aws://${{ vars.AWS_ACCOUNT_ID }}/${{ vars.AWS_ACCOUNT_REGION }} --force

      - name: ✅ CDK Synth Stack
        run: cdk synth

      - name: 🚀 Deploy CDK Stack
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(cdk deploy --require-approval never)
          echo "$DEPLOY_OUTPUT"